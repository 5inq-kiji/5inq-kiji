<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .fi1 { animation: fadeIn 0.6s ease 0.1s forwards; opacity: 0; }
      .fi2 { animation: fadeIn 0.6s ease 0.3s forwards; opacity: 0; }
      .fi3 { animation: fadeIn 0.6s ease 0.5s forwards; opacity: 0; }
      .fi4 { animation: fadeIn 0.6s ease 0.7s forwards; opacity: 0; }
      @keyframes fadeIn { to { opacity: 1; } }
      .blink { animation: blink 2s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse-active { animation: pulseA 2s ease-in-out infinite; }
      @keyframes pulseA { 0%,100% { opacity:0.5; } 50% { opacity:1; } }
    </style>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#0c0c0c" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="900" height="240" fill="#080808"/>
  <rect width="900" height="240" fill="url(#grid2)"/>

  <text x="20" y="30" font-family="'Share Tech Mono', monospace" font-size="13" fill="#606060" class="fi1">// ACTIVE OPERATIONS</text>
  <line x1="20" y1="38" x2="880" y2="38" stroke="#1e1e1e" stroke-width="1"/>

  <!-- Night City Underground -->
  <rect x="20" y="50" width="420" height="160" fill="#0a0a0a" rx="2"/>
  <rect x="20" y="50" width="3" height="160" fill="#c0c0c0" rx="1"/>
  <circle cx="416" cy="66" r="5" fill="#c0c0c0" class="pulse-active"/>
  <text x="374" y="70" font-family="'Share Tech Mono', monospace" font-size="9" fill="#606060" class="fi2">ACTIVE</text>
  <text x="35" y="74" font-family="'Share Tech Mono', monospace" font-size="13" fill="#d0d0d0" class="fi2">Night City Underground</text>
  <text x="35" y="92" font-family="'Share Tech Mono', monospace" font-size="10" fill="#383838" class="fi2">Svelte / MoonScript / Browser RPG</text>
  <line x1="35" y1="100" x2="428" y2="100" stroke="#141414" stroke-width="1"/>
  <text x="35" y="118" font-family="'Share Tech Mono', monospace" font-size="11" fill="#505050" class="fi3">Management / RPG browser game set in</text>
  <text x="35" y="134" font-family="'Share Tech Mono', monospace" font-size="11" fill="#505050" class="fi3">Night City. Territory, power, survival.</text>
  <text x="35" y="194" font-family="'Share Tech Mono', monospace" font-size="10" fill="#303030" class="fi3">STACK : Svelte · MoonScript · Node · MariaDB</text>

  <!-- Ion7 -->
  <rect x="460" y="50" width="420" height="160" fill="#0a0a0a" rx="2"/>
  <rect x="460" y="50" width="3" height="160" fill="#909090" rx="1"/>
  <circle cx="856" cy="66" r="5" fill="#909090" class="pulse-active"/>
  <text x="815" y="70" font-family="'Share Tech Mono', monospace" font-size="9" fill="#505050" class="fi2">ACTIVE</text>
  <text x="475" y="74" font-family="'Share Tech Mono', monospace" font-size="13" fill="#d0d0d0" class="fi2">Ion7 Labs</text>
  <text x="475" y="92" font-family="'Share Tech Mono', monospace" font-size="10" fill="#383838" class="fi2">LuaJIT / llama.cpp / Open Source</text>
  <line x1="475" y1="100" x2="868" y2="100" stroke="#141414" stroke-width="1"/>
  <text x="475" y="118" font-family="'Share Tech Mono', monospace" font-size="11" fill="#505050" class="fi3">Modular LLM runtime built in LuaJIT.</text>
  <text x="475" y="134" font-family="'Share Tech Mono', monospace" font-size="11" fill="#505050" class="fi3">Bindings, inference pipeline, grammar engine.</text>
  <text x="475" y="194" font-family="'Share Tech Mono', monospace" font-size="10" fill="#303030" class="fi3">STACK : LuaJIT · C · llama.cpp · SQLite</text>

  <line x1="20" y1="220" x2="880" y2="220" stroke="#111111" stroke-width="1"/>
  <text x="20" y="234" font-family="'Share Tech Mono', monospace" font-size="10" fill="#252525" class="fi4">OPERATIONS LOG LOADED <tspan class="blink">_</tspan></text>
  <text x="700" y="234" font-family="'Share Tech Mono', monospace" font-size="10" fill="#202020" class="fi4">2 ACTIVE // 0 TERMINATED</text>
</svg>
